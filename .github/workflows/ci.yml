name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GOTOOLCHAIN: auto
  GO_VERSION: '1.26.x'

jobs:
  # Fast checks that don't need build output — run in parallel.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: gofmt
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "gofmt drift:" >&2
            echo "$diff" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Tag-guarded files are invisible to the default vet run.
      - name: go vet (demoseed build tag)
        run: go vet -tags demoseed ./cmd/portalctl/

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          golangci-lint run

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Secrets / PII check
        run: ./scripts/check-no-secrets.sh

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Build
        run: make build

      - name: Test (race)
        run: go test -race -count=1 ./...

      # seed-demo is compiled out of default builds, so its guard tests only
      # exist under the demoseed tag and need a separate run.
      - name: Test (demoseed build tag)
        run: go test -race -count=1 -tags demoseed ./cmd/portalctl/

      - name: Migration up/down/up round-trip
        run: make migration-updown

      - name: Production-assembly smoke test
        run: make smoke

  sqlc-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: sqlc diff
        run: make sqlc-diff

  openapi-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: OpenAPI diff
        run: make openapi-diff
