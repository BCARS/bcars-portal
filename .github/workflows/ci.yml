name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GOTOOLCHAIN: auto
  GO_VERSION: '1.26.x'

jobs:
  # Fast checks that don't need build output — run in parallel.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: gofmt
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "gofmt drift:" >&2
            echo "$diff" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Secrets / PII check
        run: ./scripts/check-no-secrets.sh

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Build
        run: make build

      - name: Test (race)
        run: go test -race -count=1 ./...

  sqlc-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: sqlc diff
        run: |
          if [ -f sqlc.yaml ] && [ -n "$(ls internal/db/queries 2>/dev/null | grep -v '^\.gitkeep$' || true)" ]; then
            go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
            sqlc generate
            git diff --exit-code -- internal/db/sqlc
          else
            echo "no sqlc queries yet; skipping"
          fi

  openapi-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: OpenAPI diff
        run: |
          if [ -f docs/openapi.json ]; then
            make build
            ./bin/portal -dump-openapi docs/openapi.json -dump-catalog docs/capability-catalog.json
            git diff --exit-code -- docs/openapi.json docs/capability-catalog.json
          else
            echo "no openapi doc yet; skipping"
          fi
