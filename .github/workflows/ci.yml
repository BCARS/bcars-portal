name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GOTOOLCHAIN: auto
  GO_VERSION: '1.26.x'

jobs:
  # Job-level path filtering keeps required checks visible. Skipping the whole
  # workflow with paths-ignore would leave required checks pending forever.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BASE_SHA"
            head="$PUSH_HEAD_SHA"
          fi

          # The script measures from the merge base, so commits that landed on
          # the base branch after the branch point are not attributed to this
          # change (bcars-portal-8cm). It handles missing, empty and unusable
          # refs itself, and every such case runs the jobs.
          code=$(./scripts/ci-code-changed.sh --range "$base" "$head")

          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Fast checks that don't need build output — run in parallel.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: gofmt
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "gofmt drift:" >&2
            echo "$diff" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Tag-guarded files are invisible to the default vet run.
      - name: go vet (demoseed build tag)
        run: go vet -tags demoseed ./cmd/portalctl/

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          golangci-lint run

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Secrets / PII check
        run: ./scripts/check-no-secrets.sh

      - name: Version-conflict detectability check
        run: ./scripts/check-version-conflicts.sh

      - name: CI path classifier self-test
        run: ./scripts/ci-code-changed.sh --self-test

  # Split out of one 14-minute job (bcars-portal-42d). These three run the same
  # commands as before but in parallel, so the critical path is the slowest of
  # them rather than their sum. Each pays ~15s of checkout and toolchain setup,
  # which the overlap repays many times over.
  build-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Build
        run: make build

      - name: Test (race)
        run: go test -race -count=1 ./...

  # seed-demo is compiled out of default builds, so its guard tests only exist
  # under the demoseed tag and need a separate run.
  demoseed-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Test (demoseed build tag)
        run: go test -race -count=1 -tags demoseed ./cmd/portalctl/

  migrations-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Migration up/down/up round-trip
        run: make migration-updown

      - name: Production-assembly smoke test
        run: make smoke

  # The deployment artifact. `make docker` proves the image assembles; the
  # container smoke starts it the documented way — secrets from the environment,
  # migrations on a fresh volume — and asserts it reaches ready and serves its
  # own front-end assets (bcars-portal-fmc.8).
  container:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image and run the container smoke
        run: make docker-smoke

  sqlc-diff:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: sqlc diff
        run: make sqlc-diff

  openapi-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: OpenAPI diff
        run: make openapi-diff

  # The single required check for branch protection.
  #
  # Forgejo reports a job skipped by `if:` as "skipped", which is a distinct
  # state from "success" — verified on pull request #5, where a docs-only change
  # left build-test, demoseed-test, migrations-smoke, container and sqlc-diff
  # all reporting "skipped". Requiring those contexts directly risks leaving
  # every docs-only pull request unmergeable, which is the same trap the comment
  # on the `changes` job describes for paths-ignore.
  #
  # So protection requires this job and nothing else. It always runs, and fails
  # when anything it needed failed or was cancelled. Adding or renaming a CI job
  # then means editing `needs` here rather than reconfiguring protection on two
  # forges. The results are listed one per line on purpose: `needs.*.result`
  # relies on object filtering that the runner may not implement, and an
  # expression that silently evaluates to empty would make this gate pass
  # vacuously — exactly the kind of green-but-meaningless check it exists to
  # prevent.
  ci-ok:
    if: always()
    needs:
      - changes
      - lint
      - secrets
      - build-test
      - demoseed-test
      - migrations-smoke
      - container
      - sqlc-diff
      - openapi-diff
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded or was deliberately skipped
        run: |
          failed=0
          check() {
            printf '%-18s %s\n' "$1" "$2"
            case "$2" in
              success | skipped) ;;
              *) failed=1 ;;
            esac
          }
          check changes          '${{ needs.changes.result }}'
          check lint             '${{ needs.lint.result }}'
          check secrets          '${{ needs.secrets.result }}'
          check build-test       '${{ needs.build-test.result }}'
          check demoseed-test    '${{ needs.demoseed-test.result }}'
          check migrations-smoke '${{ needs.migrations-smoke.result }}'
          check container        '${{ needs.container.result }}'
          check sqlc-diff        '${{ needs.sqlc-diff.result }}'
          check openapi-diff     '${{ needs.openapi-diff.result }}'

          if [ "$failed" -ne 0 ]; then
            echo "ci-ok: at least one job did not pass" >&2
            exit 1
          fi
          echo "ci-ok: all jobs passed or were skipped"
