name: release

# Publish the container image when a version tag is pushed
# (bcars-portal-dm8).
#
# Tags are made by hand for now; semantic release is a later decision. So the
# trigger is deliberately broad enough to accept whatever the owner tags, and
# the job derives every name it publishes from that tag rather than from a
# hand-maintained list.
on:
  push:
    tags:
      - 'v*'

# The default token can write packages for this repository, so no personal
# access token is stored anywhere.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The image is exercised before it is pushed, not after. A published tag
      # is immutable in practice — someone will pull it — so the smoke test that
      # starts the container, waits for readiness and checks it carries no
      # secret runs first, and a failure means nothing is published.
      - name: Build and smoke-test the image
        run: |
          make docker-smoke \
            IMAGE=bcars-portal \
            IMAGE_TAG=${{ github.ref_name }} \
            VERSION=${{ github.ref_name }}

      - name: Sign in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io rejects an uppercase path, and a repository owner may be
      # capitalised (BCARS/bcars-portal), so the name is lowercased rather than
      # assumed.
      - name: Work out the image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # latest follows the tag, by the owner's decision: the club runs one
      # version at a time and the example manifest names latest.
      - name: Tag and push
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          VERSION: ${{ github.ref_name }}
        run: |
          docker tag "bcars-portal:${VERSION}" "${IMAGE}:${VERSION}"
          docker tag "bcars-portal:${VERSION}" "${IMAGE}:latest"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
          echo "published ${IMAGE}:${VERSION} and ${IMAGE}:latest"

      # What was published, stated by the run rather than inferred from it.
      - name: Report
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          VERSION: ${{ github.ref_name }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo '```'
            echo
            echo "\`${IMAGE}:latest\` now points at \`${VERSION}\`."
          } >> "$GITHUB_STEP_SUMMARY"
