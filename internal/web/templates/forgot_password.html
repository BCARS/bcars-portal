<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - BCARS Portal</title>
    {{template "tokens" .}}
    <style>
        /* Signed-out card. Palette, type scale and controls come from the
           shared token block; only the centred-card shell is page-specific. */
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: var(--space-5); }
        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-card);
            padding: 32px;
            width: 100%;
            max-width: 460px;
        }
        .login-card h1 { margin: 0 0 var(--space-3); font-size: 1.3em; font-weight: 700; text-align: center; }
        .login-card > p { margin: 0 0 24px; font-size: .95em; color: var(--text-helper); text-align: center; }
        .login-card .btn { display: block; width: 100%; }
        .card-link { display: block; text-align: center; margin-top: var(--space-5); font-size: .95em; }
        .hint { color: var(--text-helper); font-size: .87em; margin-top: var(--space-1); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Forgot Password</h1>
        <p>Enter your email address and we'll send you a recovery link.</p>

        {{if .Success}}
        <div class="alert-success">If an account with that email exists, a recovery link has been sent. Please check your email.</div>
        {{end}}

        {{if .Error}}
        <div class="alert-error">{{.Error}}</div>
        {{end}}

        {{if not .Success}}
        <form method="post" action="/forgot-password">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary">Send Recovery Link</button>
        </form>
        {{end}}

        <a href="/login" class="card-link">Back to sign in</a>
    </div>
</body>
</html>
