<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - BCARS Portal</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f5f5f5; color: #1a1a1a; line-height: 1.5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 32px; width: 100%; max-width: 400px; }
        .card h1 { margin: 0 0 8px; font-size: 1.25rem; font-weight: 600; text-align: center; }
        .card p { margin: 0 0 24px; font-size: 0.875rem; color: #64748b; text-align: center; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 4px; color: #374151; }
        .form-group input { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.875rem; font-family: inherit; }
        .form-group input:focus { outline: 2px solid #1a56db; outline-offset: -1px; border-color: #1a56db; }
        .btn { display: block; width: 100%; padding: 8px 16px; border-radius: 6px; font-size: 0.875rem; font-weight: 500; border: none; cursor: pointer; text-align: center; background: #1a56db; color: #fff; }
        .btn:hover { background: #1e40af; }
        .alert-success { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 0.875rem; background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
        .alert-error { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 0.875rem; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
        .link { display: block; text-align: center; margin-top: 16px; font-size: 0.875rem; color: #1a56db; text-decoration: none; }
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Forgot Password</h1>
        <p>Enter your email address and we'll send you a recovery link.</p>

        {{if .Success}}
        <div class="alert-success">If an account with that email exists, a recovery link has been sent. Please check your email.</div>
        {{end}}

        {{if .Error}}
        <div class="alert-error">{{.Error}}</div>
        {{end}}

        {{if not .Success}}
        <form method="post" action="/forgot-password">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>
            <button type="submit" class="btn">Send Recovery Link</button>
        </form>
        {{end}}

        <a href="/login" class="link">Back to sign in</a>
    </div>
</body>
</html>
