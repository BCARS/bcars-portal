<!DOCTYPE html>
<html lang="en" data-text-size="{{.TextSize}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .Page}}BCARS Portal{{end}}</title>
    {{template "tokens" .}}
    <style>
        /* Member chrome. A separate shell from the officer layout on purpose
           (see render.go): this one must never link to an /admin/ page. */
        .header {
            background: var(--surface-dark); color: #fff;
            padding: var(--space-5) var(--space-7);
            display: flex; align-items: center; justify-content: space-between;
            gap: var(--space-5); flex-wrap: wrap;
        }
        .header .wordmark { display: flex; align-items: baseline; gap: var(--space-4); }
        .header h1 { margin: 0; font-size: 1.2em; font-weight: 700; }
        .header .org { font-size: .87em; color: var(--text-muted); }
        .header nav { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .header nav a { color: var(--on-dark-secondary); font-size: .9em; }
        .header nav a:hover { color: #fff; }
        .header form { display: inline; margin: 0; }
        .header button {
            background: none; border: none; color: var(--on-dark-secondary);
            cursor: pointer; font-size: .9em; font-family: inherit; padding: 0;
        }
        .header button:hover { color: #fff; }

        .container { max-width: 760px; margin: 0 auto; padding: var(--space-7); }

        caption {
            caption-side: bottom; text-align: left; padding-top: var(--space-3);
            color: var(--text-helper); font-size: .87em;
        }
        td { vertical-align: top; }

        .form-hint { color: var(--text-helper); font-size: .87em; margin: var(--space-1) 0 0; }

        fieldset {
            border: 1px solid var(--card-border); border-radius: var(--radius-control);
            padding: var(--space-3) var(--space-5); margin: 0 0 var(--space-5);
        }
        legend { font-size: .92em; font-weight: 600; padding: 0 var(--space-1); }
        fieldset label { display: block; font-weight: 400; margin-bottom: var(--space-2); }
        fieldset input[type="radio"] { width: auto; margin-right: var(--space-3); }

        .note { color: var(--text-helper); font-size: .95em; }
    </style>
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="header">
        <span class="wordmark">
            <h1>BCARS Portal</h1>
            <span class="org">Bedford County Amateur Radio Society</span>
        </span>
        <nav aria-label="Member navigation">
            <a href="/member/">Your records</a>
            <a href="/member/requests">Your suggestions</a>
            <a href="/preferences/text-size">Text size</a>
            <form method="post" action="/logout">
                <button type="submit">Sign out</button>
            </form>
        </nav>
    </header>

    <main id="main" class="container">
        {{block "content" .Page}}{{end}}
    </main>
</body>
</html>
