<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}BCARS Portal{{end}}</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f5f5f5; color: #1a1a1a; line-height: 1.5; }
        a { color: #1a56db; }

        .skip-link { position: absolute; top: -40px; left: 0; background: #1a56db; color: #fff; padding: 8px 16px; z-index: 100; }
        .skip-link:focus { top: 0; }

        .header { background: #1e293b; color: #fff; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        .header h1 { margin: 0; font-size: 1.125rem; font-weight: 600; }
        .header nav { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .header nav a { color: #cbd5e1; font-size: 0.875rem; }
        .header nav a:hover { color: #fff; }
        .header button { background: none; border: none; color: #cbd5e1; cursor: pointer; font-size: 0.875rem; font-family: inherit; padding: 0; }
        .header button:hover { color: #fff; }

        .container { max-width: 760px; margin: 0 auto; padding: 24px; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
        .card h2 { margin: 0 0 12px; font-size: 1rem; font-weight: 600; }
        .card h3 { margin: 16px 0 8px; font-size: 0.875rem; font-weight: 600; }

        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        caption { caption-side: bottom; text-align: left; padding-top: 8px; color: #64748b; font-size: 0.8125rem; }
        th { text-align: left; padding: 8px 12px; background: #f8fafc; border-bottom: 2px solid #e2e8f0; font-weight: 600; color: #475569; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        td { padding: 8px 12px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }

        .btn { display: inline-block; padding: 6px 16px; border-radius: 6px; font-size: 0.875rem; font-weight: 500; border: 1px solid transparent; cursor: pointer; text-align: center; font-family: inherit; }
        .btn-primary { background: #1a56db; color: #fff; }
        .btn-primary:hover { background: #1e40af; text-decoration: none; }
        .btn-secondary { background: #fff; color: #374151; border-color: #d1d5db; }
        .btn-secondary:hover { background: #f9fafb; text-decoration: none; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 4px; color: #374151; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px;
            font-size: 0.875rem; font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: 2px solid #1a56db; outline-offset: -1px; border-color: #1a56db;
        }
        .form-hint { color: #64748b; font-size: 0.8125rem; margin: 4px 0 0; }

        fieldset { border: 1px solid #e2e8f0; border-radius: 6px; padding: 12px 16px; margin: 0 0 16px; }
        legend { font-size: 0.875rem; font-weight: 500; padding: 0 4px; }
        fieldset label { display: block; font-weight: 400; margin-bottom: 6px; }
        fieldset input[type="radio"] { width: auto; margin-right: 8px; }

        .badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
        .badge-green { background: #dcfce7; color: #166534; }
        .badge-yellow { background: #fef9c3; color: #854d0e; }
        .badge-red { background: #fee2e2; color: #991b1b; }
        .badge-gray { background: #f1f5f9; color: #475569; }

        .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 0.875rem; }
        .alert-info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
        .alert-success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
        .alert-error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }

        .note { color: #64748b; font-size: 0.875rem; }
        .empty-state { color: #64748b; }
        .breadcrumb { font-size: 0.875rem; margin-bottom: 16px; }
    </style>
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="header">
        <h1>BCARS Portal</h1>
        <nav aria-label="Member navigation">
            <a href="/member/">Your records</a>
            <a href="/member/requests">Your suggestions</a>
            <form method="post" action="/logout">
                <button type="submit">Sign out</button>
            </form>
        </nav>
    </header>

    <main id="main" class="container">
        {{block "content" .}}{{end}}
    </main>
</body>
</html>
