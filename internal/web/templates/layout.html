<!DOCTYPE html>
<html lang="en" data-text-size="{{.TextSize}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .Page}}BCARS Portal{{end}}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    {{template "tokens" .}}
    <style>
        /* Officer chrome. Everything not specific to this shell lives in the
           shared token block. */
        .header {
            background: var(--surface-dark); color: #fff;
            padding: var(--space-5) var(--space-7);
            display: flex; align-items: center; justify-content: space-between;
            gap: var(--space-5); flex-wrap: wrap;
        }
        .header .wordmark { display: flex; align-items: baseline; gap: var(--space-4); }
        .header h1 { margin: 0; font-size: 1.2em; font-weight: 700; }
        .header .org { font-size: .87em; color: var(--text-muted); }
        .header nav { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
        .header nav a { color: var(--on-dark-secondary); font-size: .9em; }
        .header nav a:hover { color: #fff; text-decoration: none; }
        .header form { display: inline; margin: 0; }
        .header button {
            background: none; border: none; color: var(--on-dark-secondary);
            cursor: pointer; font-size: .9em; font-family: inherit; padding: 0;
        }
        .header button:hover { color: #fff; }

        .container { max-width: 1200px; margin: 0 auto; padding: var(--space-7); }

        .nav-tabs {
            display: flex; gap: var(--space-1);
            border-bottom: 2px solid var(--card-border);
            margin-bottom: 24px;
        }
        .nav-tabs a {
            padding: var(--space-3) var(--space-5); color: var(--text-helper);
            border-bottom: 2px solid transparent; margin-bottom: -2px; font-size: .95em;
        }
        .nav-tabs a:hover { color: var(--primary); text-decoration: none; }
        .nav-tabs a.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="header">
        <span class="wordmark">
            <h1>BCARS Portal</h1>
            <span class="org">Bedford County Amateur Radio Society</span>
        </span>
        <nav aria-label="Main navigation">
            <a href="/admin/">Dashboard</a>
            <a href="/admin/members">Members</a>
            <a href="/admin/requests">Requests</a>
            <a href="/admin/treasury">Treasury</a>
            <a href="/admin/imports">Imports</a>
            <a href="/preferences/text-size">Text size</a>
            <form method="post" action="/logout">
                <button type="submit">Sign Out</button>
            </form>
        </nav>
    </header>

    <main id="main" class="container">
        {{block "content" .Page}}{{end}}
    </main>
</body>
</html>
