<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}BCARS Portal{{end}}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f5f5f5; color: #1a1a1a; line-height: 1.5; }
        a { color: #1a56db; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .skip-link { position: absolute; top: -40px; left: 0; background: #1a56db; color: #fff; padding: 8px 16px; z-index: 100; }
        .skip-link:focus { top: 0; }

        .header { background: #1e293b; color: #fff; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { margin: 0; font-size: 1.125rem; font-weight: 600; }
        .header nav a { color: #94a3b8; margin-left: 24px; font-size: 0.875rem; }
        .header nav a:hover { color: #fff; text-decoration: none; }

        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

        .nav-tabs { display: flex; gap: 4px; border-bottom: 2px solid #e2e8f0; margin-bottom: 24px; }
        .nav-tabs a { padding: 8px 16px; color: #64748b; border-bottom: 2px solid transparent; margin-bottom: -2px; font-size: 0.875rem; }
        .nav-tabs a:hover { color: #1a56db; text-decoration: none; }
        .nav-tabs a.active { color: #1a56db; border-bottom-color: #1a56db; font-weight: 500; }

        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
        .card h2 { margin: 0 0 12px; font-size: 1rem; font-weight: 600; }
        .card h3 { margin: 0 0 8px; font-size: 0.875rem; font-weight: 600; }

        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        th { text-align: left; padding: 8px 12px; background: #f8fafc; border-bottom: 2px solid #e2e8f0; font-weight: 600; color: #475569; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        td { padding: 8px 12px; border-bottom: 1px solid #f1f5f9; }
        tr:hover td { background: #f8fafc; }

        .btn { display: inline-block; padding: 6px 16px; border-radius: 6px; font-size: 0.875rem; font-weight: 500; border: 1px solid transparent; cursor: pointer; text-align: center; }
        .btn-primary { background: #1a56db; color: #fff; }
        .btn-primary:hover { background: #1e40af; text-decoration: none; }
        .btn-secondary { background: #fff; color: #374151; border-color: #d1d5db; }
        .btn-secondary:hover { background: #f9fafb; text-decoration: none; }
        .btn-danger { background: #dc2626; color: #fff; }
        .btn-danger:hover { background: #b91c1c; text-decoration: none; }
        .btn-sm { padding: 4px 12px; font-size: 0.8125rem; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 4px; color: #374151; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px;
            font-size: 0.875rem; font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: 2px solid #1a56db; outline-offset: -1px; border-color: #1a56db;
        }

        .badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
        .badge-green { background: #dcfce7; color: #166534; }
        .badge-yellow { background: #fef9c3; color: #854d0e; }
        .badge-red { background: #fee2e2; color: #991b1b; }
        .badge-gray { background: #f1f5f9; color: #475569; }
        .badge-blue { background: #dbeafe; color: #1e40af; }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; }
        .stat-card .label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-card .value { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }

        .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
        .search-bar input { flex: 1; }

        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 768px) { .detail-grid { grid-template-columns: 1fr; } }
        .detail-row { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.875rem; }
        .detail-label { width: 140px; color: #64748b; flex-shrink: 0; font-weight: 500; }
        .detail-value { flex: 1; }

        .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 0.875rem; }
        .alert-info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
        .alert-success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
        .alert-warning { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
        .alert-error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }

        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }

        .empty-state { text-align: center; padding: 48px 24px; color: #64748b; }
        .empty-state p { margin: 8px 0; }

        .breadcrumb { font-size: 0.875rem; color: #64748b; margin-bottom: 16px; }
        .breadcrumb a { color: #64748b; }
        .breadcrumb span { margin: 0 4px; }

        .flash { animation: flash-fade 0.3s ease-in; }
        @keyframes flash-fade { from { background: #fef9c3; } to { background: transparent; } }
    </style>
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="header">
        <h1>BCARS Portal</h1>
        <nav aria-label="Main navigation">
            <a href="/admin/">Dashboard</a>
            <a href="/admin/members">Members</a>
            <a href="/admin/imports">Imports</a>
        </nav>
    </header>

    <main id="main" class="container">
        {{block "content" .}}{{end}}
    </main>
</body>
</html>
