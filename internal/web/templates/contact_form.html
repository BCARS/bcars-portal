{{template "layout.html" .}}

{{define "title"}}Add Contact - {{.PersonName}} - BCARS Portal{{end}}

{{define "content"}}
<div class="breadcrumb">
    <a href="/admin/members">Members</a>
    <span>&rsaquo;</span> <a href="/admin/members/{{.PersonID}}">{{.PersonName}}</a>
    <span>&rsaquo;</span> Add Contact
</div>

<div class="card" style="max-width: 600px;">
    <h2>Add Contact Method</h2>

    {{if .Error}}
    <div class="alert alert-error">{{.Error}}</div>
    {{end}}

    <form method="post" action="/admin/members/{{.PersonID}}/contacts/new">
        <div class="form-group">
            <label for="kind">Type</label>
            <select id="kind" name="kind" required>
                <option value="email">Email</option>
                <option value="phone">Phone</option>
                <option value="postal">Postal Address</option>
            </select>
        </div>

        <div class="form-group">
            <label for="label">Label</label>
            <input type="text" id="label" name="label" placeholder="e.g. Home, Work">
        </div>

        <div class="form-group">
            <label for="value">Value</label>
            <input type="text" id="value" name="value" required placeholder="e.g. alice at example.com or 555-123-4567">
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" name="is_primary" value="1"> Set as primary
            </label>
        </div>

        <div style="display: flex; gap: 8px; justify-content: flex-end;">
            <a href="/admin/members/{{.PersonID}}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Add Contact</button>
        </div>
    </form>
</div>
{{end}}
