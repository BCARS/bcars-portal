<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accept Invitation - BCARS Portal</title>
    {{template "tokens" .}}
    <style>
        /* Signed-out card. Palette, type scale and controls come from the
           shared token block; only the centred-card shell is page-specific. */
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: var(--space-5); }
        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-card);
            padding: 32px;
            width: 100%;
            max-width: 460px;
        }
        .login-card h1 { margin: 0 0 var(--space-3); font-size: 1.3em; font-weight: 700; text-align: center; }
        .login-card > p { margin: 0 0 24px; font-size: .95em; color: var(--text-helper); text-align: center; }
        .login-card .btn { display: block; width: 100%; }
        .card-link { display: block; text-align: center; margin-top: var(--space-5); font-size: .95em; }
        .hint { color: var(--text-helper); font-size: .87em; margin-top: var(--space-1); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to BCARS Portal</h1>
        <p>Set a password to activate your account.</p>

        {{if .Error}}
        <div class="alert-error">{{.Error}}</div>
        {{end}}

        <form method="post" action="/auth/invitations/consume">
            <input type="hidden" name="token" value="{{.Token}}">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="12" autofocus>
                <div class="hint">At least 12 characters</div>
            </div>
            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" name="confirm" required minlength="12">
            </div>
            <button type="submit" class="btn btn-primary">Create Account & Sign In</button>
        </form>
    </div>
</body>
</html>
